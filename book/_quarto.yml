project:
  type: book
  output-dir: _book

book:
  title: "Learning Words from a Child's-Eye View"
  subtitle: "Bootstrapping word–object learning from a child's-eye view"
  author: "Michael C. Frank"
  search: true
  chapters:
    - index.qmd
    - 01-background.qmd
    - 02-data.qmd
    - 03-pipeline.qmd
    - 04-bootstrapping.qmd
    - 05-cues.qmd
    - 06-scaling.qmd
    - 07-what-learned.qmd
    - 08-conclusion.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: show
    fig-align: center
    df-print: paged

execute:
  enabled: false
